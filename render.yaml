services:
  - type: web
    name: taka-tracker-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    disk:
      name: taka-tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/taka-tracker.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://taka-tracker-navy.vercel.app
